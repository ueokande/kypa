name: Release
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      source-tag:
        description: Existing source-vX.Y.Z tag to rebuild or publish (leave empty to run release-please)
        required: false
        default: ""
        type: string
      publish-only:
        description: Publish an existing distribution tag without rebuilding (source-tag required)
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: kypa-release
  cancel-in-progress: false
jobs:
  release-please:
    if: github.ref == 'refs/heads/master' && inputs['source-tag'] == '' && !inputs['publish-only']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      source_tag: ${{ steps.release.outputs.tag_name }}
      source: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          target-branch: master
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
  build:
    needs: release-please
    if: >-
      !cancelled() && github.ref == 'refs/heads/master' && !inputs['publish-only'] &&
      ((needs.release-please.result == 'success' && needs.release-please.outputs.created == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs['source-tag'] != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      source: ${{ steps.release.outputs.source }}
      source_tag: ${{ steps.release.outputs.source_tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the source release
        id: release
        env:
          SOURCE_TAG: ${{ inputs['source-tag'] || needs.release-please.outputs.source_tag }}
          EXPECTED_SOURCE: ${{ needs.release-please.outputs.source }}
        run: |
          [[ "$SOURCE_TAG" =~ ^source-v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          source=$(git rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}")
          git merge-base --is-ancestor "$source" origin/master
          [[ -z "$EXPECTED_SOURCE" || "$source" == "$EXPECTED_SOURCE" ]]
          {
            echo "source=$source"
            echo "source_tag=$SOURCE_TAG"
            echo "version=${SOURCE_TAG#source-}"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ steps.release.outputs.source }}
          persist-credentials: false
      - name: Match the source tag and package versions
        env:
          SOURCE_TAG: ${{ steps.release.outputs.source_tag }}
        run: |
          package_version=$(jq -er '.version' package.json)
          manifest_version=$(jq -er '.["."]' .release-please-manifest.json)
          [[ "$SOURCE_TAG" == "source-v$package_version" && "$package_version" == "$manifest_version" ]]
      - uses: pnpm/action-setup@v5.0.0
      - uses: actions/setup-node@v6.5.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - uses: actions/upload-artifact@v6.0.0
        with:
          name: action-release-build
          path: |
            dist/action
            dist/dashboard
          if-no-files-found: error
          retention-days: 1
  publish-tag:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
      SOURCE_TAG: ${{ needs.build.outputs.source_tag }}
      SOURCE_SHA: ${{ needs.build.outputs.source }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: ${{ needs.build.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@v7.0.0
        with:
          name: action-release-build
          path: dist
      - name: Copy source GitHub Release notes
        run: gh release view "$SOURCE_TAG" --json body --jq '.body' > "$RUNNER_TEMP/kypa-release-notes.md"
      - name: Commit the build and create an immutable distribution tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force -- dist/action dist/dashboard
          git commit -m "release: prepare $RELEASE_VERSION from $SOURCE_SHA"
          git tag --annotate "$RELEASE_VERSION" -m "Release $RELEASE_VERSION (source $SOURCE_SHA)"
          git push origin "refs/tags/$RELEASE_VERSION"
      - name: Publish distribution GitHub Release
        run: gh release create "$RELEASE_VERSION" --verify-tag --title "$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/kypa-release-notes.md"
  publish-existing:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs['publish-only']
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      SOURCE_TAG: ${{ inputs['source-tag'] }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Publish only the existing distribution tag
        run: |
          [[ "$SOURCE_TAG" =~ ^source-v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          version=${SOURCE_TAG#source-}
          source=$(git rev-parse --verify "refs/tags/${SOURCE_TAG}^{commit}")
          git merge-base --is-ancestor "$source" origin/master
          [[ "$(git rev-parse --verify "refs/tags/${version}^")" == "$source" ]]
          gh release view "$SOURCE_TAG" --json body --jq '.body' > "$RUNNER_TEMP/kypa-release-notes.md"
          gh release create "$version" --verify-tag --title "$version" --notes-file "$RUNNER_TEMP/kypa-release-notes.md"
